<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex, nofollow">
<title>Définir un mot de passe — Espace client FELICITI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/espace.css?v=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23FAF6EF'/%3E%3Ctext x='7' y='24' font-family='Georgia,serif' font-size='23' font-weight='600' fill='%232E2620'%3EF%3C/text%3E%3Ccircle cx='24.5' cy='9' r='2.8' fill='%23A6845C'/%3E%3C/svg%3E">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-mark"><span class="mark">FELICIT<span class="i-last">I</span></span></div>
      <p class="auth-sub">Choisissez votre mot de passe</p>

      <p id="chk-loading" class="auth-msg">Vérification du lien…</p>

      <form id="pw-form" hidden>
        <div class="auth-field">
          <label for="pw-1">Nouveau mot de passe (8 caractères minimum)</label>
          <input id="pw-1" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="auth-field">
          <label for="pw-2">Confirmez le mot de passe</label>
          <input id="pw-2" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="auth-btn" type="submit" id="pw-btn">Valider et accéder à mon espace</button>
      </form>
      <div id="pw-msg"></div>

      <p class="auth-foot" id="invalid-foot" hidden><a href="../mot-de-passe-oublie/">Demander un nouveau lien</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>window.ESPACE_BASE = '../';</script>
  <script src="../js/client-shared.js?v=1"></script>
  <script>
    (function () {
      var sb = FeliClient.sb;

      function msg(el, text, kind) {
        el.innerHTML = text ? '<p class="auth-msg ' + kind + '">' + text + '</p>' : '';
      }

      /* Le lien reçu par e-mail (invitation ou réinitialisation) redirige
         ici avec les jetons de session dans le fragment d'URL (#access_
         token=...) : le SDK Supabase les détecte tout seul au chargement
         (detectSessionInUrl, activé par défaut) et ouvre la session. On
         attend juste que ce soit fait avant d'afficher le formulaire. */
      sb.auth.getSession().then(function (res) {
        document.getElementById('chk-loading').hidden = true;
        var session = res.data && res.data.session;
        if (!session) {
          msg(document.getElementById('pw-msg'),
            'Ce lien est invalide ou a expiré.', 'error');
          document.getElementById('invalid-foot').hidden = false;
          return;
        }
        document.getElementById('pw-form').hidden = false;
      });

      document.getElementById('pw-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = document.getElementById('pw-btn');
        var msgEl = document.getElementById('pw-msg');
        var p1 = document.getElementById('pw-1').value;
        var p2 = document.getElementById('pw-2').value;
        msg(msgEl, '', '');

        if (p1 !== p2) {
          msg(msgEl, 'Les deux mots de passe ne correspondent pas.', 'error');
          return;
        }
        btn.disabled = true; btn.textContent = 'Enregistrement…';

        sb.auth.updateUser({ password: p1 }).then(function (res) {
          if (res.error) {
            msg(msgEl, res.error.message, 'error');
            btn.disabled = false; btn.textContent = 'Valider et accéder à mon espace';
            return;
          }
          window.location.replace('../');
        });
      });
    })();
  </script>
</body>
</html>
