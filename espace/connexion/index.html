<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex, nofollow">
<title>Connexion — Espace client FELICITI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/espace.css?v=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23FAF6EF'/%3E%3Ctext x='7' y='24' font-family='Georgia,serif' font-size='23' font-weight='600' fill='%232E2620'%3EF%3C/text%3E%3Ccircle cx='24.5' cy='9' r='2.8' fill='%23A6845C'/%3E%3C/svg%3E">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-mark"><span class="mark">FELICIT<span class="i-last">I</span></span></div>
      <p class="auth-sub">Espace client</p>

      <form id="login-form">
        <div class="auth-field">
          <label for="li-email">E-mail</label>
          <input id="li-email" type="email" autocomplete="username" required>
        </div>
        <div class="auth-field">
          <label for="li-pass">Mot de passe</label>
          <input id="li-pass" type="password" autocomplete="current-password" required>
        </div>
        <button class="auth-btn" type="submit" id="login-btn">Se connecter</button>
      </form>
      <div id="login-msg"></div>

      <p class="auth-foot">Mot de passe oublié ? <a href="../mot-de-passe-oublie/">Le réinitialiser</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>window.ESPACE_BASE = '../';</script>
  <script src="../js/client-shared.js?v=1"></script>
  <script>
    (function () {
      var sb = FeliClient.sb;

      function msg(el, text, kind) {
        el.innerHTML = text ? '<p class="auth-msg ' + kind + '">' + text + '</p>' : '';
      }

      /* Si un ?refuse=1 arrive depuis le garde de session (compte connecté
         mais pas lié à un couple), on l'explique clairement. */
      if (/[?&]refuse=1/.test(window.location.search)) {
        msg(document.getElementById('login-msg'),
          'Ce compte n’est pas encore relié à un espace client. Contactez-nous si le problème persiste.', 'error');
      }

      /* Si déjà connecté, on saute direct au tableau de bord. */
      sb.auth.getSession().then(function (res) {
        var session = res.data && res.data.session;
        if (!session) return;
        sb.rpc('is_client_couple_id').then(function (r) {
          if (r.data) window.location.replace('../');
        });
      });

      document.getElementById('login-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = document.getElementById('login-btn');
        var msgEl = document.getElementById('login-msg');
        msg(msgEl, '', '');
        btn.disabled = true; btn.textContent = 'Connexion…';

        sb.auth.signInWithPassword({
          email: document.getElementById('li-email').value.trim(),
          password: document.getElementById('li-pass').value
        }).then(function (res) {
          if (res.error) {
            msg(msgEl, 'E-mail ou mot de passe incorrect.', 'error');
            btn.disabled = false; btn.textContent = 'Se connecter';
            return;
          }
          return sb.rpc('is_client_couple_id').then(function (r) {
            if (!r.data) {
              sb.auth.signOut();
              msg(msgEl, 'Ce compte n’est pas encore relié à un espace client.', 'error');
              btn.disabled = false; btn.textContent = 'Se connecter';
              return;
            }
            window.location.replace('../');
          });
        });
      });
    })();
  </script>
</body>
</html>
