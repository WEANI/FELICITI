# FELICITI — hébergement statique sur Netlify
# Le dépôt racine EST le site : rien à builder, on publie tel quel.
[build]
  publish = "."

# Cache long pour les médias (frames/posters). Le CSS/JS est busté par ?v=N.
[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# En-têtes de sécurité sobres
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Page fusionnée dans /notre-approche/
[[redirects]]
  from = "/comment-ca-marche/*"
  to = "/notre-approche/"
  status = 301

# Site de mariage supprimé, Le Faire-Part devient le produit phare tout-en-un
[[redirects]]
  from = "/site-de-mariage/*"
  to = "/faire-part-video/"
  status = 301

# Produit Naissance supprimé, contenu repris sous forme informative dans Autres occasions
[[redirects]]
  from = "/naissance/*"
  to = "/autres-occasions/"
  status = 301

# /creations était un doublon obsolète du catalogue, remplacé par /prestations
[[redirects]]
  from = "/creations/*"
  to = "/prestations/"
  status = 301

# Livre d'Or vidéo n'est plus vendu séparément, exclusif à la formule Le Grand Jour
[[redirects]]
  from = "/livre-d-or-video/*"
  to = "/le-grand-jour/"
  status = 301

# Capsule anniversaire retirée (page inachevée, jamais commercialisée)
[[redirects]]
  from = "/capsule-anniversaire/*"
  to = "/prestations/"
  status = 301
