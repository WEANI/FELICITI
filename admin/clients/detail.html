<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex, nofollow">
<title>Client — Admin FELICITI</title>
<link rel="stylesheet" href="../css/admin.css?v=5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23FAF6EF'/%3E%3Ctext x='7' y='24' font-family='Georgia,serif' font-size='23' font-weight='600' fill='%232E2620'%3EF%3C/text%3E%3Ccircle cx='24.5' cy='9' r='2.8' fill='%23A6845C'/%3E%3C/svg%3E">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar-slot"></aside>
    <main class="admin-main">
      <a class="admin-back" href="./">← Tous les clients</a>
      <div id="det-loading" class="admin-loading">Chargement…</div>
      <div id="det-content" hidden>
        <div class="admin-header"><h1 id="det-title">Client</h1></div>
        <div class="admin-grid-2">
          <div class="admin-section">
            <h2>Historique des commandes</h2>
            <div id="det-commandes"></div>
          </div>
          <div class="admin-section">
            <h2>Fiche</h2>
            <dl class="admin-kv" id="det-kv"></dl>
          </div>
        </div>
      </div>
      <p class="admin-empty" id="det-notfound" hidden>Client introuvable.</p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>window.ADMIN_BASE = '../'; window.ADMIN_NAV_ID = 'clients';</script>
  <script src="../js/admin-shared.js?v=3"></script>
  <script>
    (function () {
      var WORKFLOW_LABELS = {
        nouveau: 'Nouveau', onboarding_envoye: 'Onboarding envoyé',
        questionnaire_recu: 'Questionnaire reçu', en_creation: 'En création',
        a_valider: 'À valider', video_livree: 'Vidéo livrée', termine: 'Terminé',
        annulee: 'Annulée', devis: 'Devis', en_cours: 'En cours', livree: 'Livrée'
      };
      function eur(v) { return (v || 0).toLocaleString('fr-FR') + ' €'; }
      function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

      var id = new URLSearchParams(window.location.search).get('id');
      if (!id) {
        document.getElementById('det-loading').hidden = true;
        document.getElementById('det-notfound').hidden = false;
      } else {
        FeliAdmin.requireSession().then(function (auth) {
          if (!auth) return;
          var sb = FeliAdmin.sb;

          Promise.all([
            sb.from('couples').select('*').eq('id', id).maybeSingle(),
            sb.from('commandes').select('id,statut,payment_statut,montant_total,created_at').eq('couple_id', id).order('created_at', { ascending: false })
          ]).then(function (results) {
            var couple = results[0].data;
            if (!couple) {
              document.getElementById('det-loading').hidden = true;
              document.getElementById('det-notfound').hidden = false;
              return;
            }
            var commandes = results[1].data || [];

            document.getElementById('det-title').textContent =
              [couple.prenom_1, couple.prenom_2].filter(Boolean).join(' & ') || couple.email || 'Client';

            document.getElementById('det-kv').innerHTML =
              '<dt>E-mail</dt><dd>' + esc(couple.email || '—') + '</dd>' +
              '<dt>WhatsApp</dt><dd>' + esc(couple.whatsapp || '—') + '</dd>' +
              '<dt>Date mariage</dt><dd>' + esc(couple.date_mariage || '—') + '</dd>' +
              '<dt>Lieu</dt><dd>' + esc(couple.lieu || '—') + '</dd>' +
              '<dt>Invités</dt><dd>' + esc(couple.nombre_invites != null ? couple.nombre_invites : '—') + '</dd>' +
              '<dt>Client depuis</dt><dd>' + new Date(couple.created_at).toLocaleDateString('fr-FR') + '</dd>';

            var cEl = document.getElementById('det-commandes');
            cEl.innerHTML = commandes.length
              ? commandes.map(function (c) {
                  return '<p style="margin:.4rem 0;font-size:.87rem"><a href="../commandes/detail.html?id=' + c.id + '">' +
                    new Date(c.created_at).toLocaleDateString('fr-FR') + ' — ' + eur(c.montant_total) +
                    ' — ' + (WORKFLOW_LABELS[c.statut] || c.statut) + '</a></p>';
                }).join('')
              : '<p class="admin-empty">Aucune commande pour l’instant.</p>';

            document.getElementById('det-loading').hidden = true;
            document.getElementById('det-content').hidden = false;
          });
        });
      }
    })();
  </script>
</body>
</html>
