<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="only light">
  <meta name="robots" content="noindex">
  <title>Merci — FELICITI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=66">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23FAF6EF'/%3E%3Ctext x='7' y='24' font-family='Georgia,serif' font-size='23' font-weight='600' fill='%232E2620'%3EF%3C/text%3E%3Ccircle cx='24.5' cy='9' r='2.8' fill='%23A6845C'/%3E%3C/svg%3E">
</head>
<body>
  <!--
    Page de confirmation après paiement : Stripe redirige ici une fois la
    commande réglée (?prestation=SLUG). Hors menu principal, noindex.
    v2 : texte sans prix, second bouton WhatsApp, transmet ?prestation=
    au questionnaire. Voir feliciti-page-merci-v2.md.
    v3 : crée automatiquement la commande côté Supabase à l'arrivée sur
    cette page et transmet son id au questionnaire (?commande=). Auto-
    déclaré côté client — pas de webhook Stripe sur ce projet statique,
    voir le commentaire sur payment_statut en base pour le détail de cette
    limite (déjà documentée pour /post-achat).
    v4 : si le lien de paiement Stripe transmet ?session_id=
    ({CHECKOUT_SESSION_ID}, à configurer par lien dans le Dashboard Stripe),
    l'e-mail du client est récupéré automatiquement depuis Stripe — plus
    besoin de le redemander. Le formulaire e-mail reste affiché en secours
    si ce paramètre est absent (lien pas encore mis à jour) ou en cas
    d'échec de la récupération.
  -->
  <a class="q-back" href="../">← Retour à l'accueil</a>

  <section class="merci-page">
    <span class="merci-wordmark">FELICITI</span>
    <h1>Merci pour votre commande&nbsp;!</h1>
    <p id="merciLigne1">Votre commande a bien été validée.</p>
    <p>La prochaine étape&nbsp;: remplissez votre questionnaire d'onboarding pour que nous puissions composer votre création.</p>

    <form id="merciEmailForm" class="form-wrap" style="margin:1.5rem 0" hidden>
      <div class="form-field">
        <label for="merciEmail">Votre e-mail, pour recevoir la confirmation et le lien du questionnaire</label>
        <input id="merciEmail" name="email" type="email" placeholder="vous@exemple.fr" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-solid" id="merciEmailBtn">Recevoir ma confirmation</button>
      </div>
    </form>
    <p id="merciEmailMsg" role="status" aria-live="polite"></p>

    <div class="merci-btns">
      <a class="merci-cta" id="merciCta" href="../questionnaire/">Remplir mon questionnaire</a>
      <a class="merci-whatsapp" href="https://wa.me/33600000000?text=Bonjour%20FELICITI%2C%20je%20viens%20de%20commander" target="_blank" rel="noopener">Nous écrire</a>
    </div>
  </section>

  <script src="../js/prestations-config.js"></script>
  <script>
    (function () {
      var SUPABASE_URL      = 'https://wrpiggqshnoykqtmuprx.supabase.co';
      var SUPABASE_ANON_KEY = 'sb_publishable_TT-qEm5ADIWQEE0e_qO2NQ_gx3pyZ1O';

      var params = new URLSearchParams(window.location.search);
      var slug = params.get('prestation');
      var sessionId = params.get('session_id');
      var ctaEl = document.getElementById('merciCta');
      var emailForm = document.getElementById('merciEmailForm');
      var emailMsg = document.getElementById('merciEmailMsg');
      var currentCommandeId = null;

      function sbHeaders(extra) {
        var h = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY };
        for (var k in extra) h[k] = extra[k];
        return h;
      }

      function setCta(commandeId) {
        currentCommandeId = commandeId;
        var url = '../questionnaire/?prestation=' + encodeURIComponent(slug);
        if (commandeId) url += '&commande=' + encodeURIComponent(commandeId);
        ctaEl.href = url;
      }

      /* Si le lien Stripe transmet ?session_id=, récupère l'e-mail
         directement depuis Stripe (fonction resolve-checkout-email) — pas
         besoin de le redemander. Le formulaire e-mail sert de secours :
         affiché immédiatement s'il n'y a pas de session_id, ou après coup
         si la récupération automatique échoue. Ne bloque jamais l'affichage
         de la confirmation en cas d'échec réseau. */
      function tryAutoEmail(commandeId) {
        if (!sessionId) { emailForm.hidden = false; return; }
        var storageKey = 'felicitiEmailResolved:' + commandeId;
        if (sessionStorage.getItem(storageKey)) return;

        emailMsg.textContent = 'Récupération de votre confirmation…';
        fetch(SUPABASE_URL + '/functions/v1/resolve-checkout-email', {
          method: 'POST',
          headers: sbHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ commande_id: commandeId, session_id: sessionId })
        }).then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        }).then(function (data) {
          sessionStorage.setItem(storageKey, '1');
          if (data && data.skipped) {
            emailMsg.textContent = '';
            emailForm.hidden = false;
            return;
          }
          emailMsg.textContent = 'Confirmation envoyée — vérifiez votre boîte mail (et vos spams, au cas où).';
        }).catch(function (err) {
          console.warn('FELICITI · récupération e-mail Stripe impossible', err);
          emailMsg.textContent = '';
          emailForm.hidden = false;
        });
      }

      /* Envoie l'e-mail (via upsert_couple_for_commande) : c'est ce qui
         déclenche côté base l'envoi du mail de confirmation (trigger sur
         commandes.couple_id, voir migration trigger_email_confirmation). */
      emailForm.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!currentCommandeId) {
          emailMsg.textContent = 'Un instant, la commande est en cours de création… réessayez dans quelques secondes.';
          return;
        }
        var btn = document.getElementById('merciEmailBtn');
        btn.disabled = true; btn.textContent = 'Envoi…';
        fetch(SUPABASE_URL + '/rest/v1/rpc/upsert_couple_for_commande', {
          method: 'POST',
          headers: sbHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ p_commande_id: currentCommandeId, p_email: document.getElementById('merciEmail').value.trim() })
        }).then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          emailForm.hidden = true;
          emailMsg.textContent = 'Confirmation envoyée — vérifiez votre boîte mail (et vos spams, au cas où).';
        }).catch(function (err) {
          console.warn('FELICITI · envoi confirmation impossible', err);
          btn.disabled = false; btn.textContent = 'Recevoir ma confirmation';
          emailMsg.textContent = 'Une erreur est survenue, réessayez ou contactez-nous sur WhatsApp.';
        });
      });

      /* Crée la commande + son item côté Supabase, une seule fois par visite
         (sessionStorage évite les doublons si la page est rechargée). Ne
         bloque jamais l'affichage de la confirmation en cas d'échec réseau. */
      function creerCommande(prestationId, prixEuros) {
        var storageKey = 'felicitiCommande:' + slug;
        var existing = sessionStorage.getItem(storageKey);
        if (existing) { setCta(existing); tryAutoEmail(existing); return; }

        var commandeId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : null;
        if (!commandeId) { setCta(null); emailForm.hidden = false; return; }

        fetch(SUPABASE_URL + '/rest/v1/commandes', {
          method: 'POST',
          headers: sbHeaders({ 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }),
          body: JSON.stringify({
            id: commandeId,
            statut: 'onboarding_envoye',
            payment_statut: 'paye',
            montant_total: prixEuros
          })
        }).then(function (res) {
          if (!res.ok) throw new Error('commande HTTP ' + res.status);
          return fetch(SUPABASE_URL + '/rest/v1/commande_items', {
            method: 'POST',
            headers: sbHeaders({ 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }),
            body: JSON.stringify({ commande_id: commandeId, prestation_id: prestationId, prix: prixEuros, quantite: 1 })
          });
        }).then(function (res) {
          if (!res.ok) throw new Error('commande_items HTTP ' + res.status);
          sessionStorage.setItem(storageKey, commandeId);
          setCta(commandeId);
          tryAutoEmail(commandeId);
        }).catch(function (err) {
          console.warn('FELICITI · création commande impossible', err);
          setCta(null);
          emailForm.hidden = false;
        });
      }

      if (slug && typeof PRESTATIONS !== 'undefined' && PRESTATIONS[slug]) {
        var p = PRESTATIONS[slug];
        document.getElementById('merciLigne1').textContent =
          'Votre commande — ' + p.nom + ' — a bien été validée.';
        document.title = 'Merci — ' + p.nom + ' — FELICITI';
        setCta(null);

        fetch(SUPABASE_URL + '/rest/v1/prestations?slug=eq.' + encodeURIComponent(slug) + '&select=id', {
          headers: sbHeaders({})
        }).then(function (res) { return res.ok ? res.json() : []; })
          .then(function (rows) {
            if (rows && rows[0]) {
              creerCommande(rows[0].id, parseInt(p.prix, 10) || 0);
            } else {
              emailForm.hidden = false;
            }
          }).catch(function (err) {
            console.warn('FELICITI · lecture prestation impossible', err);
            emailForm.hidden = false;
          });
      } else {
        emailForm.hidden = false;
      }
    })();
  </script>
</body>
</html>
